{% extends 'home.html' %}

{% block content %}

<div class="h-screen">

    <h1 class="font-black text-2xl">
        Members Data Table
    </h1>


    <!-- Top Controls -->
    <div class="flex flex-col gap-2 mt-5">


        <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">


            <!-- Export -->
            <select id="menu" name="menu"
                class="w-full sm:w-[180px] border border-gray-300 rounded-lg px-3 py-2 bg-white outline-none focus:border-cyan-600 cursor-pointer">

                <option value="" selected disabled>
                    Export
                </option>

                <option value="pdf">
                    PDF
                </option>

                <option value="excel">
                    Excel
                </option>

                <option value="csv">
                    CSV
                </option>

                <option value="json">
                    JSON
                </option>

            </select>



            <!-- Right Side -->
            <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3 w-full md:w-auto">


                <!-- Search -->
                <input type="search"
                    placeholder="Search..."
                    class="w-full sm:w-auto border border-gray-300 rounded-lg px-4 py-1 outline-none focus:border-[#006d8b]">


                <!-- Icons -->
                <div class="flex flex-wrap gap-3">


                    <button
                        class="w-8 h-8 border border-gray-300 cursor-pointer flex items-center justify-center hover:bg-[#006d8b] hover:text-white transition">

                        <i class="bi bi-clipboard"></i>

                    </button>


                    <button
                        class="w-8 h-8 border border-gray-300 cursor-pointer flex items-center justify-center hover:bg-[#006d8b] hover:text-white transition">

                        <i class="bi bi-arrow-clockwise"></i>

                    </button>


                    <button
                        class="w-8 h-8 border border-gray-300 cursor-pointer flex items-center justify-center hover:bg-[#006d8b] hover:text-white transition">

                        <i class="bi bi-clipboard-data"></i>

                    </button>


                    <button
                        class="w-8 h-8 border border-gray-300 cursor-pointer flex items-center justify-center hover:bg-[#006d8b] hover:text-white transition">

                        <i class="bi bi-menu-button-wide"></i>

                    </button>


                    <button
                        class="w-8 h-8 border border-gray-300 cursor-pointer flex items-center justify-center hover:bg-[#006d8b] hover:text-white transition">

                        <i class="bi bi-graph-up-arrow"></i>

                    </button>


                </div>


            </div>


        </div>


    </div>




    <!-- Table -->
    <div class="w-full overflow-x-auto mt-1.5">


        <table class="w-full border-collapse border border-gray-300">


            <thead class="bg-gray-100">


                <tr>


                    <th class="border border-gray-300 px-4 py-3">
                        <input type="checkbox">
                    </th>


                    <th class="border border-gray-300 px-4 py-3">
                        Member ID
                    </th>


                    <th class="border border-gray-300 px-4 py-3">
                        Member Name
                    </th>


                    <th class="border border-gray-300 px-4 py-3">
                        Email
                    </th>


                    <th class="border border-gray-300 px-4 py-3">
                        Phone Number
                    </th>


                    <th class="border border-gray-300 px-4 py-3">
                        Action
                    </th>


                </tr>


            </thead>




            <tbody>


                {% for item in showmember %}


                <tr class="hover:bg-gray-50">


                    <td class="border border-gray-300 px-4 py-3 text-center">

                        <input type="checkbox">

                    </td>



                    <td class="border border-gray-300 px-4 py-3">

                        {{ item.ID }}

                    </td>



                    <td class="border border-gray-300 px-4 py-3">

                        {{ item.Name }}

                    </td>



                    <td class="border border-gray-300 px-4 py-3">

                        {{ item.email }}

                    </td>



                    <td class="border border-gray-300 px-4 py-3">

                        {{ item.Phone_Number }}

                    </td>



                    <td class="border border-gray-300 px-4 py-3 text-center">


                        <span class="flex gap-5 justify-center text-lg">


                            <!-- Edit -->
                            <a href="">
                                <i class="bi bi-pencil-square text-green-600 cursor-pointer"></i>
                            </a>



                            <!-- Delete -->
                            <a href="">
                                <i class="bi bi-trash3 text-red-600 cursor-pointer"></i>
                            </a>



                        </span>


                    </td>


                </tr>



                {% empty %}


                <tr>

                    <td colspan="6"
                        class="border border-gray-300 px-4 py-10 text-center text-gray-500">

                        No members available

                    </td>

                </tr>



                {% endfor %}


            </tbody>


        </table>


    </div>


</div>


{% endblock %}
